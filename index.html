<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retail Demo Tracker Pro</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #034EA2; --success: #28a745; --gray: #f4f4f9; }
        body { font-family: -apple-system, Sans-Serif; margin: 0; background: var(--gray); padding-bottom: 50px; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        
        #reader { width: 100%; background: black; min-height: 250px; }
        .input-section { padding: 15px; background: white; border-bottom: 2px solid #ddd; display: flex; flex-direction: column; }
        
        /* Save Button at the Top for thumb accessibility */
        .btn-save { background: var(--success); color: white; width: 100%; padding: 18px; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; margin-bottom: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-save:active { background: #218838; transform: translateY(2px); }

        label { font-size: 11px; font-weight: bold; color: #666; text-transform: uppercase; margin-top: 5px; }
        input { width: 100%; padding: 12px; margin: 4px 0 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        .btn-row { display: flex; gap: 8px; }
        .btn-row div { flex: 1; display: flex; flex-direction: column; }
        
        .history-section { padding: 15px; }
        .table-container { overflow-x: auto; max-height: 350px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #eee; position: sticky; top: 0; }

        .action-buttons { padding: 0 15px 20px 15px; display: flex; flex-direction: column; gap: 10px; }
        .btn-secondary { padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; color: white; }
        .btn-download { background: #6f42c1; }
        .btn-copy { background: #007bff; }
        .btn-clear { background: #dc3545; margin-top: 10px; }
    </style>
</head>
<body>

<header>RETAIL DEMO TRACKER</header>

<div id="reader"></div>

<div class="input-section">
    <button class="btn-save" onclick="saveDevice()">SAVE & NEXT SCAN</button>

    <label>Serial / IMEI</label>
    <input type="text" id="imei" placeholder="Scanning/Type here...">
    
    <div class="btn-row">
        <div>
            <label>Model</label>
            <input type="text" id="model" placeholder="e.g. S24 Ultra">
        </div>
        <div>
            <label>Color</label>
            <input type="text" id="color" placeholder="e.g. Titanium">
        </div>
    </div>
    
    <div class="btn-row">
        <div>
            <label>Store Name</label>
            <input type="text" id="storeName" placeholder="Enter Store">
        </div>
        <div>
            <label>Zone / Table</label>
            <input type="text" id="location" placeholder="e.g. Table A1">
        </div>
    </div>
</div>

<div class="history-section">
    <label>Search History</label>
    <input type="text" id="filter" placeholder="Filter by store, model, or IMEI..." onkeyup="renderTable()">
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Store</th>
                    <th>Model</th>
                    <th>IMEI</th>
                    <th>Zone</th>
                </tr>
            </thead>
            <tbody id="deviceBody"></tbody>
        </table>
    </div>
</div>

<div class="action-buttons">
    <button class="btn-secondary btn-download" onclick="downloadCSV()">DOWNLOAD CSV FILE</button>
    <button class="btn-secondary btn-copy" onclick="copyToClipboard()">COPY ALL FOR EXCEL</button>
    <button class="btn-secondary btn-clear" onclick="clearData()">WIPE ALL LOCAL DATA</button>
</div>

<script>
    let devices = JSON.parse(localStorage.getItem('demoDevices') || '[]');
    const beep = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFRm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YV9vT18AAAAA');

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: {width: 250, height: 150} });
    
    html5QrcodeScanner.render((text) => {
        if (document.getElementById('imei').value !== text) {
            document.getElementById('imei').value = text;
            beep.play(); 
            if (navigator.vibrate) navigator.vibrate(50);
        }
    });

    function saveDevice() {
        const imeiVal = document.getElementById('imei').value;
        const modelVal = document.getElementById('model').value;
        const colorVal = document.getElementById('color').value;
        const storeVal = document.getElementById('storeName').value;
        const locVal = document.getElementById('location').value;

        if (!imeiVal) return alert("Please scan or enter an IMEI first.");

        const device = {
            imei: imeiVal,
            model: modelVal,
            color: colorVal,
            storeName: storeVal,
            location: locVal,
            timestamp: new Date().toISOString().split('T')[0]
        };

        devices.unshift(device);
        localStorage.setItem('demoDevices', JSON.stringify(devices));
        
        // Reset device-specific info but KEEP Store and Zone for continuous flow
        document.getElementById('imei').value = '';
        document.getElementById('model').value = '';
        document.getElementById('color').value = '';
        
        if (navigator.vibrate) navigator.vibrate([30, 30, 30]);
        renderTable();
    }

    function renderTable() {
        const filter = document.getElementById('filter').value.toLowerCase();
        const tbody = document.getElementById('deviceBody');
        tbody.innerHTML = '';

        devices.filter(d => 
            d.storeName.toLowerCase().includes(filter) || 
            d.model.toLowerCase().includes(filter) ||
            d.imei.toLowerCase().includes(filter)
        ).forEach(d => {
            tbody.innerHTML += `<tr>
                <td>${d.storeName}</td>
                <td>${d.model}</td>
                <td>${d.imei}</td>
                <td>${d.location}</td>
            </tr>`;
        });
    }

    function generateCSV() {
        if (devices.length === 0) return null;
        const headers = "Date,Store_Name,Model,Color,IMEI_Serial,Location\n";
        const rows = devices.map(d => `${d.timestamp},${d.storeName},${d.model},${d.color},${d.imei},${d.location}`).join("\n");
        return headers + rows;
    }

    function downloadCSV() {
        const csvContent = generateCSV();
        if (!csvContent) return alert("No data to export");
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const storeRef = document.getElementById('storeName').value || 'Audit';
        link.setAttribute("href", url);
        link.setAttribute("download", `${storeRef}_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function copyToClipboard() {
        const csv = generateCSV();
        if (!csv) return;
        navigator.clipboard.writeText(csv).then(() => alert("Copied to clipboard!"));
    }

    function clearData() {
        if (confirm("This will delete all scanned history. Proceed?")) {
            devices = [];
            localStorage.removeItem('demoDevices');
            renderTable();
        }
    }

    renderTable();
</script>

</body>
</html>
