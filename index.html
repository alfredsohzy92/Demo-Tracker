<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retail Demo Tracker Pro</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #034EA2; --success: #28a745; --gray: #f4f4f9; }
        body { font-family: -apple-system, Sans-Serif; margin: 0; background: var(--gray); padding-bottom: 50px; }
        header { background: var(--primary); color: white; padding: 12px; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; font-size: 14px; }
        
        /* Fixed Viewfinder - Adjusted to show the box properly */
        #reader { width: 100%; background: black; min-height: 220px; }
        
        .input-section { padding: 12px; background: white; border-bottom: 2px solid #ddd; }
        
        .btn-save { background: var(--success); color: white; width: 100%; padding: 16px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-save:active { transform: scale(0.98); }

        label { font-size: 10px; font-weight: bold; color: #888; text-transform: uppercase; }
        input { width: 100%; padding: 10px; margin: 2px 0 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; background: #fff; }
        
        .btn-row { display: flex; gap: 6px; }
        .btn-row div { flex: 1; }
        
        .history-section { padding: 12px; }
        .table-container { overflow-x: auto; max-height: 400px; border-radius: 6px; border: 1px solid #ddd; }
        
        table { width: 100%; border-collapse: collapse; background: white; font-size: 11px; table-layout: fixed; }
        th, td { border: 1px solid #ddd; padding: 8px 4px; text-align: left; word-wrap: break-word; }
        th { background: #f0f0f0; position: sticky; top: 0; font-size: 10px; }
        
        .editable { background: #fffdf0; }

        .action-buttons { padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .btn-sec { padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 13px; color: white; text-align: center; text-decoration: none; }
        .btn-download { background: #6f42c1; }
        .btn-copy { background: #007bff; }
        .btn-clear { background: #dc3545; margin-top: 10px; }
    </style>
</head>
<body>

<header>RETAIL DEMO TRACKER</header>

<div id="reader"></div>

<div class="input-section">
    <button class="btn-save" onclick="saveDevice()">SAVE & NEXT SCAN</button>

    <label>Serial / IMEI</label>
    <input type="text" id="imei">
    
    <div class="btn-row">
        <div><label>Model</label><input type="text" id="model"></div>
        <div><label>Color</label><input type="text" id="color"></div>
    </div>
    
    <div class="btn-row">
        <div><label>Store Name</label><input type="text" id="storeName"></div>
        <div><label>Zone / Table</label><input type="text" id="location"></div>
    </div>
</div>

<div class="history-section">
    <label>Search / Filter</label>
    <input type="text" id="filter" onkeyup="renderTable()">
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 20%">Store</th>
                    <th style="width: 20%">Model</th>
                    <th style="width: 30%">IMEI</th>
                    <th style="width: 15%">Color</th>
                    <th style="width: 15%">Zone</th>
                </tr>
            </thead>
            <tbody id="deviceBody"></tbody>
        </table>
    </div>
</div>

<div class="action-buttons">
    <button class="btn-sec btn-download" onclick="downloadCSV()">DOWNLOAD CSV</button>
    <button class="btn-sec btn-copy" onclick="copyToClipboard()">COPY FOR EXCEL</button>
    <button class="btn-sec btn-clear" onclick="clearData()">WIPE ALL DATA</button>
</div>

<script>
    let devices = JSON.parse(localStorage.getItem('demoDevices') || '[]');
    const beep = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFRm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YV9vT18AAAAA');

    // Adjusted Scan Box Logic
    const scanner = new Html5QrcodeScanner("reader", { 
        fps: 20, 
        qrbox: (viewfinderWidth, viewfinderHeight) => {
            return {
                width: viewfinderWidth * 0.8,
                height: 120 // Fixed height for the scan box to keep it visible in short view
            };
        },
        aspectRatio: 1.0
    });

    scanner.render((text) => {
        if (document.getElementById('imei').value !== text) {
            document.getElementById('imei').value = text;
            beep.play(); 
            if (navigator.vibrate) navigator.vibrate(50);
        }
    });

    function saveDevice() {
        const imeiVal = document.getElementById('imei').value;
        if (!imeiVal) return;

        const device = {
            id: Date.now(),
            imei: imeiVal,
            model: document.getElementById('model').value,
            color: document.getElementById('color').value,
            storeName: document.getElementById('storeName').value,
            location: document.getElementById('location').value,
            timestamp: new Date().toISOString().split('T')[0]
        };

        devices.unshift(device);
        updateStorage();
        
        document.getElementById('imei').value = '';
        document.getElementById('model').value = '';
        document.getElementById('color').value = '';
        
        if (navigator.vibrate) navigator.vibrate([30, 30]);
        renderTable();
    }

    function editCell(id, field, value) {
        const index = devices.findIndex(d => d.id === id);
        if (index !== -1) {
            devices[index][field] = value.trim();
            updateStorage();
        }
    }

    function updateStorage() {
        localStorage.setItem('demoDevices', JSON.stringify(devices));
    }

    function renderTable() {
        const filter = document.getElementById('filter').value.toLowerCase();
        const tbody = document.getElementById('deviceBody');
        tbody.innerHTML = '';

        devices.filter(d => 
            d.storeName.toLowerCase().includes(filter) || 
            d.model.
